[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph2note"
version = "0.1.0"
description = "Manuscript Compiler — Document IR schema + deterministic Markdown renderer"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0", "Pillow>=10.0"]

[project.optional-dependencies]
# 开发/测试：pytest + FastAPI TestClient 的 httpx + gold 复核 PDF 合集生成
dev = ["pytest>=8.0", "reportlab>=4.0,<5", "httpx>=0.27"]
# imaging/raster deps for the parse pipeline (preprocess, downscaled VLM input)
vision = ["Pillow>=9", "numpy>=1.24"]
pdf = ["pymupdf>=1.24"]  # scanned-PDF page splitting (issue 09 ingest)
# local single-user Web app (issue 06): FastAPI + uvicorn + multipart uploads
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# macOS desktop bundle: native WebView window + PyInstaller app packaging
macos = ["numpy>=1.24", "pywebview>=5.4", "pyinstaller>=6.0"]
# deterministic diagram/flow rendering (issue 05): graphviz dot preferred,
# matplotlib pure-Python fallback
diagram = ["graphviz>=0.20", "matplotlib>=3.5"]
# 一键安装全部可选依赖（开发/测试 + 运行全能力）
all = [
    "pytest>=8.0", "reportlab>=4.0,<5", "httpx>=0.27",
    "Pillow>=9", "numpy>=1.24", "pymupdf>=1.24",
    "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9",
    "graphviz>=0.20", "matplotlib>=3.5",
    "pywebview>=5.4", "pyinstaller>=6.0",
]

[project.scripts]
graph2note = "graph2note.cli:main"

[tool.setuptools]
packages = [
    "graph2note",
    "graph2note.diagrams",
    "graph2note.ingest",
    "graph2note.notes",
    "graph2note.semantic",
    "graph2note.verify",
    "eval",
]

[tool.setuptools.package-data]
graph2note = ["webstatic/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    # 模块归属（issue 12；每测试文件一个，见 tests/taxonomy.py）
    "ir: Document IR schema 与校验",
    "render: 确定性 Markdown 渲染",
    "preprocess: 图像预处理（方向/透视/裁剪/对比度）",
    "pipeline: 解析管线装配（preprocess->router->vlm->render）",
    "ingest: PDF 拆页/去重/缺页预警",
    "verify: 双模型交叉验证",
    "webapp: 本地单用户 Web 应用",
    "notes: Obsidian 导出/分类/MOC",
    "workspace: knowledge-workspace（collections/graph/inbox/metadata/tags/timeline/telemetry）",
    "visualqa: 视觉 QA 开发工具（UI/内容）",
    "eval: 评估 harness 与网关传输层",
    "diagrams: diagram/flow 确定性渲染",
    "config: 运行配置 / LLM 设置",
    "store: 文档库持久化",
    "cli: CLI 入口",
    "meta: 测试基础设施自身（分类元测试）",
    # 层次
    "unit: 单模块纯逻辑测试",
    "integration: 跨模块/全链/Web/CLI 测试",
    # 成本
    "slow: 较重（TestClient 全链/全链装配/图渲染）",
    "live_llm: 需真实 LLM 调用（仅手动显式运行，CI 不跑）",
    "gui: 需 GUI/浏览器（仅手动）",
]

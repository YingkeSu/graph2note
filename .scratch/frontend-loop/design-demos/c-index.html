<!doctype html><html lang="zh-CN"><!-- Assumptions: empty local library; existing product labels; no fabricated documents. Reasoning: see ../design-spec.md. Prototype only; actions disclose preview scope. --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C · 知识索引 · graph2note</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{color:inherit;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 16px}a{color:inherit;text-decoration:none}h1{font-size:36px;line-height:1.3;font-weight:600;letter-spacing:-1px}h2{font-size:24px}p{color:var(--muted)}.brand{font:600 25px Georgia,serif;letter-spacing:-1px}.shell{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{padding:32px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:32px}.nav{display:flex;flex-direction:column;gap:4px}.nav a{padding:10px 14px;border-radius:5px}.nav .active{color:var(--accent);background:var(--soft);font-weight:600}.caption{font-size:12px;letter-spacing:2px;color:var(--muted)}.secondary{margin-top:auto}.top{height:88px;padding:22px 40px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px}.top input{border:0;background:transparent;color:inherit;width:100%;outline-offset:6px}.top form{flex:1}.primary{background:var(--accent);color:var(--on);border-color:var(--accent)}.content{padding:46px 56px}.heading{display:flex;align-items:end;justify-content:space-between}.heading h1{margin:12px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0;padding-bottom:24px;border-bottom:1px solid var(--line)}.filters button{border:0;font-size:14px}.filters .selected{background:var(--soft);color:var(--accent)}.empty{min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);background:var(--panel)}.empty p{max-width:440px;margin:0 0 26px}.folio{font:italic 58px Georgia,serif;color:var(--accent);margin-bottom:12px}.footer{margin-top:24px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.notice{padding:18px;border:1px solid var(--line);margin-top:18px}.hidden{display:none}.density{font-size:12px;color:var(--muted)}@media(max-width:700px){.shell{display:block}.side{padding:20px;border-right:0;border-bottom:1px solid var(--line)}.nav{flex-direction:row;overflow:auto}.nav a{white-space:nowrap}.side .collection,.secondary{display:none}.top{padding:16px 20px}.content{padding:28px 20px}.heading{display:block}.empty{padding:24px}.footer{gap:20px}}:root{--bg:#fff;--panel:#fff;--ink:#222b35;--muted:#596572;--line:#d6dde2;--accent:#2459a6;--on:#fff;--soft:#eaf1fa}.shell{display:block}.side{display:grid;grid-template-columns:180px 1fr;align-items:center;padding:24px 48px;gap:24px;border-bottom:1px solid var(--line)}.nav{flex-direction:row;justify-content:flex-end}.nav a{white-space:nowrap;padding:8px 12px}.collection,.secondary{display:none}.top{height:72px;padding:16px 56px}.content{max-width:1280px;margin:auto}.empty{display:grid;grid-template-columns:240px 1fr;text-align:left;padding:50px;gap:12px;border-left:0;border-right:0}.folio{grid-row:1/4;font-size:100px;font-style:normal}.empty h2,.empty p{margin:0}.empty button{justify-self:start;align-self:start}.heading h1{font-family:Georgia,"Songti SC",serif}@media(max-width:900px){.side{display:block;padding:20px}.nav{justify-content:flex-start;overflow:auto}.empty{display:flex;align-items:flex-start;padding:24px}.folio{font-size:54px}}</style><body><div class="shell"><aside class="side"><a class="brand" href="#">graph2note</a><nav class="nav" aria-label="主导航"><a href="#preview" data-preview="文档库" class="active">文档库</a><a href="#preview" data-preview="时间轴" class="">时间轴</a><a href="#preview" data-preview="知识图谱" class="">知识图谱</a><a href="#preview" data-preview="数据看板" class="">数据看板</a><a href="#preview" data-preview="待整理" class="">待整理</a><a href="#preview" data-preview="标签词表" class="">标签词表</a><a href="#preview" data-preview="问答" class="">问答</a></nav><div class="collection"><div class="caption">集合</div><p>按主题整理你的文档</p><button data-preview="新建集合">＋ 新建集合</button></div><div class="secondary"><p>本地工作空间</p><a data-preview="LLM 设置" href="#preview">LLM 设置</a><br><a data-preview="导出 Vault" href="#preview">导出 Vault</a><br><a data-preview="修复报告" href="#preview">修复报告</a></div></aside><div><header class="top"><form id="search"><input aria-label="搜索文档" placeholder="搜索文档 / PDF" type="search"></form><button class="primary" data-preview="新解析">＋ 新解析</button></header><main class="content"><div class="caption">FROM MANUSCRIPT TO KNOWLEDGE</div><div class="heading"><div><h1>本地文档库</h1><p>从一页手稿开始，留下可以继续使用的知识。</p></div><div class="density">紧凑 / 舒适</div></div><div class="filters" aria-label="文档过滤"><button class="selected" aria-pressed="true">全部</button><button aria-pressed="false">今日新增</button><button aria-pressed="false">本周新增</button><button aria-pressed="false">最近编辑</button></div><section class="empty"><div class="folio" aria-hidden="true">Aa</div><h2>你的第一份手稿，从这里开始。</h2><p>还没有文档。上传一张手稿图片开始解析，随后在文档库中整理、阅读与编辑。</p><button class="primary" data-preview="新解析">上传手稿</button></section><div class="footer"><span>原图 · 识别结果 · Markdown</span><span>内容保存在本地</span></div><div id="notice" class="notice hidden" role="status"></div></main></div></div><script>const notice=document.querySelector('#notice');function show(t){notice.textContent=t;notice.classList.remove('hidden')}document.querySelectorAll('[data-preview]').forEach(e=>e.onclick=()=>show(e.dataset.preview+'：当前为设计方向初稿，业务功能在现有应用中使用。'));document.querySelectorAll('.filters button').forEach(e=>e.onclick=()=>{document.querySelectorAll('.filters button').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});e.classList.add('selected');e.setAttribute('aria-pressed','true');show(e.textContent+'：当前文档库为空。')});document.querySelector('#search').onsubmit=e=>{e.preventDefault();show('当前文档库为空，暂无搜索结果。')};</script></body></html>
